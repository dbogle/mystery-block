<text x="40" y="868" font-size="13" fill="#556">Red = +5 V, black = GND. Keep LED + DFPlayer power wires short and thick-ish (22-24 AWG). SS49E pins left→right (flat face toward you): VCC, GND, OUT.</text>
<text x="40" y="888" font-size="13" fill="#556">If the cam turns the wrong way (it stalls against the drop and the LEDs blink red), swap the two motor wires or set MOTOR_REVERSE 1.</text>
<text x="40" y="34" font-size="22" font-weight="bold" fill="#223">Mystery Block wiring</text>
