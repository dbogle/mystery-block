name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cad:
    name: CAD build + fit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cad/requirements.txt
      - run: pip install -r cad/requirements.txt
      - name: Export all parts
        run: python cad/build.py --no-render
      - name: Design tests (fit, interference, ball path, capacity)
        run: pytest cad -v

  firmware:
    name: Firmware compile + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hit detector + launcher unit tests (host)
        run: |
          for t in hit_detector launcher; do
            g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/mystery_block \
              firmware/test/test_$t.cpp -o /tmp/test_$t
            /tmp/test_$t
          done
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core + libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install "DFRobotDFPlayerMini" "Adafruit NeoPixel"
      - name: Compile for Arduino Nano
        run: arduino-cli compile --fqbn arduino:avr:nano --warnings default firmware/mystery_block

  audio:
    name: Sound generator runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python audio/make_sounds.py
